name: waylo
description: A premium tourism companion app with offline maps, audio guides, group travel planning, and memories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Backend
  supabase_flutter: ^2.3.0
  dio: ^5.4.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Maps & Location
  mapbox_gl: ^0.16.0
  geolocator: ^11.0.0
  geofencing_api: ^0.2.0

  # Audio
  just_audio: ^0.9.36

  # Media & Photos
  image_picker: ^1.0.7
  exif: ^3.3.0
  cached_network_image: ^3.3.1
  photo_manager: ^3.0.0

  # Routing
  go_router: ^13.2.0

  # Notifications
  flutter_local_notifications: ^17.0.0

  # Connectivity
  connectivity_plus: ^6.0.2

  # Sharing & Links
  share_plus: ^7.2.2
  url_launcher: ^6.2.4

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
