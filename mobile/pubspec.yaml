name: waylo
description: A premium tourism companion app with offline maps, audio guides, group travel planning, and memories.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Backend & Networking
  supabase_flutter: ^2.3.0
  dio: ^5.4.0
  http: ^1.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Maps & Location
  geolocator: ^11.0.0

  # Audio
  just_audio: ^0.9.36

  # Media & Photos
  image_picker: ^1.0.7
  exif: ^3.3.0

  # Routing
  go_router: ^13.2.0

  # Notifications
  flutter_local_notifications: ^17.0.0


  # Sharing & Links
  share_plus: any
  url_launcher: ^6.2.4

  # Utilities
  uuid: ^4.3.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
